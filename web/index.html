<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移动云杯 · 本地论文库热点挖掘</title>
<!--
  最小参考前端（原生 JS，无构建、无 CDN）：用来证明接口够用，也给前端同学一个起点。
  直接改或整页删掉都行 —— 接口只有两条：
    GET  /api/meta   → 数据源 / 参数表 / 能力
    POST /api/ask    → 问答（加 "stream": true 走 SSE 进度）
  字段表见 规划/2026-10-18-接口契约-前端与算法.md
-->
<style>
  :root{
    --bg:#0f1419; --panel:#171d24; --panel2:#1e252d; --line:#2b3540;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#4c9aff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .app{display:grid;grid-template-columns:290px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto}
  main{display:flex;flex-direction:column;min-width:0}
  h1{font-size:15px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  .grp{margin:14px 0 6px;color:var(--dim);font-size:12px;letter-spacing:.04em}
  select,input,textarea,button{font:inherit;color:var(--fg);background:var(--panel2);
       border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
  select:focus,input:focus,textarea:focus{outline:1px solid var(--accent)}
  .param{display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center;margin:6px 0}
  .param label{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
  .param input[type=checkbox]{width:18px;height:18px}
  .row{display:flex;gap:8px}
  .chat{flex:1;overflow:auto;padding:20px 24px}
  .msg{max-width:900px;margin:0 auto 18px}
  .msg.user .bubble{background:#1f3550;border-left:3px solid var(--accent)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .meta{color:var(--dim);font-size:12px;margin:6px 0}
  .cite{background:#243447;border:1px solid #33506e;border-radius:5px;
        padding:0 4px;font-size:12px;color:#9ecbff;cursor:pointer}
  .topics{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:10px 0}
  .topic{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .topic b{font-size:13px}
  .topic .dim{color:var(--dim);font-size:12px}
  .composer{border-top:1px solid var(--line);padding:12px 24px;background:var(--panel)}
  .composer .row{gap:10px;align-items:flex-end}
  .composer textarea{resize:none;height:52px}
  button{cursor:pointer;background:#233246;border-color:#33506e;white-space:nowrap}
  button:hover{background:#2a3d55}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08121f;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .stages{list-style:none;padding:0;margin:8px 0;font-size:12px;color:var(--dim)}
  .stages li{margin:2px 0}
  .stages li.run{color:var(--fg)}
  .stages li.done{color:var(--ok)}
  .warn{color:var(--warn);font-size:12px}
  .bad{color:var(--bad)}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
  a{color:#9ecbff}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>本地论文库 · 热点挖掘</h1>
    <div class="sub">参考前端（无账号系统）· 契约 v<span id="ver">?</span></div>

    <div class="grp">数据源</div>
    <select id="source"></select>

    <div class="grp">API 配置（只存本机 localStorage）</div>
    <input id="baseUrl" placeholder="base_url">
    <div style="height:6px"></div>
    <input id="model" placeholder="model">
    <div style="height:6px"></div>
    <input id="apiKey" type="password" placeholder="api_key">
    <div class="row" style="margin-top:8px">
      <button onclick="saveCfg()">保存</button>
      <button onclick="clearChat()">清空对话</button>
    </div>

    <div class="grp">检索参数（由 /api/meta 自动生成）</div>
    <div id="params"></div>

    <div class="grp">模式</div>
    <label class="param" style="grid-template-columns:1fr 78px">
      <span>追问（带前文）</span><input type="checkbox" id="followup">
    </label>
  </aside>

  <main>
    <div class="chat" id="chat">
      <div class="msg"><div class="bubble">
        问一个方向试试，例如「2025 RLHF 方向最火的是什么？」。<br>
        <span class="meta">打开左侧「追问」后，服务端会把上一轮引用过的论文摘要并进上下文。</span>
      </div></div>
    </div>
    <div class="composer">
      <div class="row">
        <textarea id="q" placeholder="问点什么…（Ctrl/⌘ + Enter 发送）"></textarea>
        <button class="primary" id="send" onclick="send()">发送</button>
      </div>
      <div class="meta" id="hint"></div>
    </div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { meta: null, history: [], busy: false };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 极简 markdown：粗体 / 行内代码 / 换行。够用即可，复杂排版交给正式前端。
function md(text, citations) {
  const byId = {};
  (citations || []).forEach(c => byId[c.id] = c);
  let h = esc(text);
  h = h.replace(/\[([PC]):([A-Za-z0-9_.\-:]+)\]/g, (m, kind, id) => {
    const c = byId[id];
    const tip = c ? (c.title || c.label || id) : "未在语料中找到";
    return `<span class="cite" title="${esc(tip)}">${kind}:${esc(id)}</span>`;
  });
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.split(/\n{2,}/).map(p => `<p style="margin:.5em 0">${p.replace(/\n/g, "<br>")}</p>`).join("");
}

async function loadMeta() {
  const r = await fetch("/api/meta");
  const m = await r.json();
  state.meta = m;
  $("#ver").textContent = m.contract_version || "?";
  $("#source").innerHTML = (m.sources || []).map(s => {
    const unavailable = (s.note || "").includes("索引未构建");
    const suffix = unavailable ? " · 索引未构建" : `（${(s.papers || 0).toLocaleString()} 篇）`;
    return `<option value="${esc(s.key)}" ${unavailable ? "disabled" : ""}>${esc(s.label)}${esc(suffix)}</option>`;
  }).join("");
  const firstAvailable = (m.sources || []).find(s => !(s.note || "").includes("索引未构建"));
  if (firstAvailable) $("#source").value = firstAvailable.key;
  // 参数表 → 表单（分组建控件，前端不应硬编码参数名）
  const groups = {};
  (m.params || []).forEach(p => (groups[p.group] = groups[p.group] || []).push(p));
  $("#params").innerHTML = Object.entries(groups).map(([g, ps]) => `
    <div class="grp">${esc(g)}</div>
    ${ps.map(p => p.type === "bool"
      ? `<label class="param"><span title="${esc(p.help)}">${esc(p.label)}</span>
           <input type="checkbox" data-p="${esc(p.key)}" ${p.value ? "checked" : ""}></label>`
      : `<div class="param"><label title="${esc(p.help)}">${esc(p.label)}</label>
           <input type="number" data-p="${esc(p.key)}" value="${p.value}"
                  min="${p.min ?? ""}" max="${p.max ?? ""}" step="${p.step ?? 1}"></div>`
    ).join("")}`).join("");
  $("#baseUrl").value = localStorage.getItem("hs_base") || (m.llm && m.llm.base_url) || "";
  $("#model").value = localStorage.getItem("hs_model") || (m.llm && m.llm.model) || "";
  $("#apiKey").value = localStorage.getItem("hs_key") || "";
  if (m.warnings && m.warnings.length) $("#hint").textContent = m.warnings.join(" · ");
}

function saveCfg() {
  localStorage.setItem("hs_base", $("#baseUrl").value.trim());
  localStorage.setItem("hs_model", $("#model").value.trim());
  localStorage.setItem("hs_key", $("#apiKey").value.trim());
  $("#hint").textContent = "已保存到本机";
}

function collectParams() {
  const out = {};
  document.querySelectorAll("[data-p]").forEach(el => {
    out[el.dataset.p] = el.type === "checkbox" ? el.checked
      : (el.value === "" ? undefined : Number(el.value));
  });
  Object.keys(out).forEach(k => out[k] === undefined && delete out[k]);
  return out;
}

function clearChat() {
  state.history = [];
  $("#chat").innerHTML = "";
}

function bubble(role, html, meta) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="bubble">${html}</div>${meta ? `<div class="meta">${meta}</div>` : ""}`;
  $("#chat").appendChild(el);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return el;
}

const STAGES = [["parse","意图解析"],["retrieve","检索+聚类"],["name","主题命名"],["answer","生成回答"],["verify","引用校验"]];

function stageList() {
  return `<ul class="stages">${STAGES.map(([k, l]) => `<li data-s="${k}">○ ${l}</li>`).join("")}</ul>`;
}

function paintStage(root, ev) {
  const lis = root.querySelectorAll(".stages li");
  const idx = STAGES.findIndex(([k]) => k === ev.stage);
  lis.forEach((li, i) => {
    li.className = i < idx ? "done" : (i === idx ? "run" : "");
    if (i < idx) li.textContent = "✅ " + STAGES[i][1];
  });
  const cur = lis[idx];
  if (!cur) return;
  const label = STAGES[idx][1];
  const q = (ev.total ? ` ${ev.cur}/${ev.total}` : "") + (ev.elapsed ? ` · ${ev.elapsed.toFixed(1)}s` : "");
  cur.textContent = "⏳ " + label + q;
}

function renderAnswer(resp) {
  const a = resp.answer || {};
  let html = "";
  if (resp.error) html += `<p class="bad">${esc(resp.error.message || "出错了")}</p>`;
  if (resp.refused) html += `<p class="warn">${esc(resp.refuse_reason || "本库无相关内容")}</p>`;
  html += md(a.text || "（空）", a.citations);

  if ((resp.topics || []).length) {
    html += `<div class="topics">` + resp.topics.map(t => `
      <div class="topic"><b>[C:${t.cluster_id}] ${esc(t.label || "未命名")}</b>
        <div>${esc(t.core || "")}</div>
        <div class="dim">${t.size} 篇 · ${Object.entries(t.venue_counts || {}).map(([k,v])=>`${k} ${v}`).join("、") || "—"}</div>
      </div>`).join("") + `</div>`;
  }
  if ((a.citations || []).length) {
    html += `<details><summary>引用来源（${a.citations.length}）</summary>` +
      a.citations.map(c => c.kind === "cluster"
        ? `<div class="dim">[C:${esc(c.id)}] ${esc(c.title)}</div>`
        : `<div>[P:${esc(c.id)}] ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>` : esc(c.title)}
             <span class="dim">${esc(c.venue || "")} ${c.year || ""}</span></div>`).join("") +
      `</details>`;
  }
  if ((a.verdicts || []).length) {
    const bad = a.verdicts.filter(v => v.status !== "supported").length;
    html += `<details><summary>引用校验 ${a.verdicts.length} 条（${bad} 条有问题）</summary>` +
      a.verdicts.map(v => `<div class="dim">${v.status === "supported" ? "✅" : "⚠️"} ${esc(v.status)} — ${esc((v.text || "").slice(0, 110))}</div>`).join("") +
      `</details>`;
  }
  if ((resp.warnings || []).length) {
    html += `<details><summary>降级提示（${resp.warnings.length}）</summary>` +
      resp.warnings.map(w => `<div class="warn">· ${esc(w)}</div>`).join("") + `</details>`;
  }
  const u = resp.usage || {};
  const meta = [
    `路由 ${resp.route}`,
    `过滤 ${a.n_filtered ?? 0} 条`,
    u.elapsed_s ? `${u.elapsed_s}s` : "",
    u.llm_calls ? `LLM ${u.llm_calls} 次` : "",
    u.tokens_in ? `token ${u.tokens_in}+${u.tokens_out}` : "",
    u.cost_yuan ? `¥${u.cost_yuan}` : "",
  ].filter(Boolean).join(" · ");
  return { html, meta };
}

async function send() {
  const q = $("#q").value.trim();
  if (!q || state.busy) return;
  state.busy = true; $("#send").disabled = true;
  $("#q").value = "";
  bubble("user", md(q));

  const holder = bubble("assistant", stageList());
  const body = {
    question: q,
    source: $("#source").value,
    mode: $("#followup").checked && state.history.length ? "followup" : "new",
    history: state.history,
    params: collectParams(),
    llm: { base_url: $("#baseUrl").value.trim(), model: $("#model").value.trim(), api_key: $("#apiKey").value.trim() },
    stream: true,
  };

  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    if (!r.headers.get("content-type", "").includes("event-stream")) {
      const err = await r.json();
      bubble("assistant", `<p class="bad">${esc(err.error?.message || "请求失败")}</p>`);
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", result = null;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const chunks = buf.split("\n\n");
      buf = chunks.pop();
      for (const chunk of chunks) {
        const evLine = chunk.split("\n").find(l => l.startsWith("event: "));
        const dataLine = chunk.split("\n").filter(l => l.startsWith("data: ")).map(l => l.slice(6)).join("");
        if (!dataLine) continue;
        const payload = JSON.parse(dataLine);
        if (evLine && evLine.includes("result")) { result = payload; }
        else if (evLine && evLine.includes("error")) { bubble("assistant", `<p class="bad">${esc(payload.error?.message || "出错")}</p>`); }
        else if (payload.type === "stage") paintStage(holder, payload);
      }
    }
    if (result) {
      const { html, meta } = renderAnswer(result);
      holder.innerHTML = `<div class="bubble">${html}</div><div class="meta">${meta}</div>`;
      state.history.push({ role: "user", text: q });
      state.history.push({
        role: "assistant", text: result.answer.text || "",
        citation_ids: (result.answer.citations || []).filter(c => c.kind === "paper").map(c => c.id),
      });
      if (!$("#followup").checked) state.history = state.history.slice(-6);
    }
  } catch (e) {
    bubble("assistant", `<p class="bad">${esc(String(e))}</p>`);
  } finally {
    state.busy = false; $("#send").disabled = false;
    $("#chat").scrollTop = $("#chat").scrollHeight;
  }
}

$("#q").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") send();
});
loadMeta().catch(e => { $("#hint").textContent = "连不上服务：先跑 python scripts/run_server.py"; });
</script>
</body>
</html>
